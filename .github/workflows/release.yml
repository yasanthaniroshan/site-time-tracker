name: Release

# Publishes a GitHub Release with an installable zip whenever a version tag is pushed:
#   git tag v1.0.1 && git push origin v1.0.1
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches manifest version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION="$(jq -r .version manifest.json)"
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::Tag ($TAG_VERSION) does not match manifest.json version ($MANIFEST_VERSION)"
            exit 1
          fi
          echo "VERSION=$TAG_VERSION" >> "$GITHUB_ENV"

      - name: Package extension
        run: |
          mkdir -p dist
          zip -r "dist/site-time-tracker-${VERSION}.zip" \
            manifest.json icons/*.png src \
            -x "*.DS_Store"
          unzip -l "dist/site-time-tracker-${VERSION}.zip"

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            /^## \[/               { found=0 }
            found
          ' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then echo "HAS_NOTES=true" >> "$GITHUB_ENV"; else echo "HAS_NOTES=false" >> "$GITHUB_ENV"; fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Site Time Tracker ${{ github.ref_name }}
          files: dist/*.zip
          body_path: ${{ env.HAS_NOTES == 'true' && 'notes.md' || '' }}
          generate_release_notes: ${{ env.HAS_NOTES != 'true' }}
