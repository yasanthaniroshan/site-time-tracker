<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Site Time Tracker – Settings</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 40px 20px; min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: #f3f4f6; color: #1f2937;
    }
    main {
      max-width: 520px; margin: 0 auto; padding: 28px;
      background: #fff; border-radius: 18px;
      box-shadow: 0 10px 30px rgba(17,24,39,.08), 0 2px 6px rgba(17,24,39,.05);
    }
    header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    header img { width: 40px; height: 40px; }
    h1 { font-size: 20px; margin: 0; }
    header p { margin: 2px 0 0; font-size: 13px; color: #6b7280; }
    h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #6b7280; margin: 26px 0 10px; }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 10px 0; border-bottom: 1px solid #f1f5f9; }
    .row:last-child { border-bottom: 0; }
    .row label { font-size: 14px; }
    .row small { display: block; color: #6b7280; font-size: 12px; margin-top: 2px; }
    input[type=number], select {
      font: inherit; font-size: 14px; padding: 7px 10px; width: 130px;
      border: 1px solid #d1d5db; border-radius: 8px; background: #fff; color: inherit;
    }
    input[type=checkbox] { width: 18px; height: 18px; accent-color: #10b981; }
    .actions { display: flex; align-items: center; gap: 10px; margin-top: 26px; }
    button {
      font: inherit; font-size: 14px; font-weight: 600; padding: 9px 18px;
      border-radius: 10px; border: 0; cursor: pointer;
    }
    #save { background: #10b981; color: #fff; }
    #save:hover { background: #059669; }
    #reset { background: #f3f4f6; color: #374151; }
    #status { font-size: 13px; color: #059669; }
    #status.error { color: #dc2626; }
    @media (prefers-color-scheme: dark) {
      body { background: #111827; color: #f9fafb; }
      main { background: #1f2937; }
      .row { border-color: #374151; }
      input[type=number], select { background: #111827; border-color: #4b5563; }
      #reset { background: #374151; color: #f9fafb; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <img src="../../icons/icon-48.png" alt="">
      <div>
        <h1>Site Time Tracker</h1>
        <p>Settings are saved to your Chrome profile.</p>
      </div>
    </header>

    <h2>Tracked sites</h2>
    <div id="sites"></div>

    <h2>Timer</h2>
    <div class="row">
      <label for="blockMinutes">Block length<small>Minutes per progress-bar cycle</small></label>
      <input id="blockMinutes" type="number" min="1" max="120" step="1">
    </div>
    <div class="row">
      <label for="warnAfterBlocks">Turn orange after<small>Number of blocks</small></label>
      <input id="warnAfterBlocks" type="number" min="1" max="100" step="1">
    </div>
    <div class="row">
      <label for="dangerAfterBlocks">Turn red after<small>Number of blocks</small></label>
      <input id="dangerAfterBlocks" type="number" min="2" max="100" step="1">
    </div>

    <h2>Appearance</h2>
    <div class="row">
      <label for="position">Card position</label>
      <select id="position"></select>
    </div>
    <div class="row">
      <label for="startMinimized">Start minimized<small>Show the compact card by default</small></label>
      <input id="startMinimized" type="checkbox">
    </div>

    <div class="actions">
      <button id="save">Save</button>
      <button id="reset" type="button">Reset to defaults</button>
      <span id="status" role="status"></span>
    </div>
  </main>

  <script src="../content/config.js"></script>
  <script src="options.js"></script>
</body>
</html>
